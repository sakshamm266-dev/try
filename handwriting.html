<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doorlo</title>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #fff;
            font-family: 'Product Sans', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #4285f4;
            font-family: 'Product Sans', Arial, sans-serif;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 10px 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(60,64,67,.07);
        }
        .search-box input {
            border: none;
            outline: none;
            font-size: 1.2rem;
            flex: 1;
            background: transparent;
        }
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        .search-btn {
            background: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: border 0.2s;
        }
        .search-btn:hover {
            border: 1px solid #c6c6c6;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            color: #888;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="logo">doorlo</div>
        <form class="search-box" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" autocomplete="off" autofocus>
        </form>
        <div class="buttons">
            <button class="search-btn" onclick="document.querySelector('.search-box').submit();">Doorlo Search</button>
            <button class="search-btn" onclick="window.location.href='https://www.google.com/doodles';return false;">I'm Feeling Lucky</button>
        </div>
    </div>
    <footer>
        &copy; 2024 doorlo
    </footer>
</body>
</html>
